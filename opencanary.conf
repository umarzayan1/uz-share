{
    "device.node_id": "web01",

    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "formatters": {
                "plain": {
                    "format": "%(message)s"
                }
            },
            "handlers": {
                "file": {
                    "class": "logging.FileHandler",
                    "filename": "/var/log/opencanary/opencanary.log",
                    "formatter": "plain"
                }
            }
        }
    },

    "ssh.enabled": true,
    "ssh.port": 22,
    "ssh.version": "SSH-2.0-OpenSSH_9.6p1 Ubuntu-3ubuntu13",

    "http.enabled": true,
    "http.port": 80,
    "http.skin": "basicLogin",

    "https.enabled": true,
    "https.port": 443,

    "ftp.enabled": false,
    "telnet.enabled": false,
    "mysql.enabled": false,
    "mssql.enabled": false,
    "redis.enabled": false,
    "smb.enabled": false,
    "snmp.enabled": false,
    "sip.enabled": false,
    "ntp.enabled": false,
    "vnc.enabled": false,
    "rdp.enabled": false
}
